<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Interfaz del Maestro IA - Chat especializado en meditación y recetas naturales">
    <title>Maestro IA - Chat</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Maestro IA</h1>
        <p>Bienvenido al asistente virtual especializado en meditación y recetas naturales.</p>
    </header>

    <main>
        <!-- Contenedor del chat -->
        <div id="chat-container">
            <div id="chat-box">
                <!-- Los mensajes del chat se generarán dinámicamente aquí -->
            </div>
            <div id="user-input">
                <input type="text" id="userMessage" placeholder="Escribe tu pregunta aquí..." aria-label="Escribe tu pregunta" />
                <button id="sendMessage">Enviar</button>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2024 La Salud al Alcance de Tus Manos. Todos los derechos reservados.</p>
    </footer>

    <script src="chat.js"></script>
</body>
</html>
